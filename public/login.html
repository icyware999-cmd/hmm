<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>avoidkxrried :: Welcome</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-header">
        <svg class="esports-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
          <defs>
            <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff2b43" />
              <stop offset="100%" stop-color="#990012" />
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#glow)">
            <path d="M 50 12 L 80 25 L 80 55 C 80 75 50 90 50 90 C 50 90 20 75 20 55 L 20 25 Z" fill="none" stroke="url(#neonRed)" stroke-width="4"/>
            <path d="M 28 72 L 72 28 M 72 28 L 75 25 M 28 72 L 25 75 M 63 32 L 68 37 M 32 63 L 37 68" stroke="url(#neonRed)" stroke-width="3" stroke-linecap="round"/>
            <path d="M 72 72 L 28 28 M 28 28 L 25 25 M 72 72 L 75 75 M 37 32 L 32 37 M 63 68 L 68 63" stroke="url(#neonRed)" stroke-width="3" stroke-linecap="round"/>
            <polygon points="50,30 65,45 50,60 35,45" fill="url(#neonRed)" opacity="0.8"/>
            <circle cx="50" cy="45" r="4" fill="#ffffff" />
          </g>
        </svg>
        <h1>avoid<span>kxrried</span></h1>
        <p>SECURE INCOMING EMAIL PORTAL</p>
      </div>

      <form id="buyer-login-form">
        <div class="form-group">
          <div class="input-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="email" id="login-email" class="form-input" placeholder="Custom Linked Email Address" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <div class="input-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" class="form-input" placeholder="Provided Portal Password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-primary">LOGIN</button>
      </form>

      <div id="login-error" style="color: #ff2b43; font-size: 13px; margin-top: 15px; display: none; font-weight: 600;"></div>

      <div class="login-footer">
        avoidkxrried x ZST &bull; SECURE GATEWAY
      </div>
    </div>
  </div>

  <script>
    document.getElementById('buyer-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      
      errorDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          sessionStorage.setItem('buyer_email', data.email);
          sessionStorage.setItem('ubi_linked', data.ubiLinked);
          window.location.href = '/inbox';
        } else {
          errorDiv.textContent = data.error || 'Login verification failed.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Server connection error. Please try again.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
